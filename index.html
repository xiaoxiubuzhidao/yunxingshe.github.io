<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务迁移通知</title>
    <style>
        :root {
            --primary-color: #0066ff;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            fill: var(--primary-color);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        /* 链接样式，保持简洁 */
        .link-text {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
        }

        .link-text:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SVG Icon -->
        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>

        <h1>服务器已迁移</h1>
        <p>为了提供更稳定、高效的服务，我们的服务器已完成迁移。<br>请前往新官网继续使用我们的服务。</p>

        <!-- 纯文本链接，去掉了箭头符号 -->
        <a href="http://192.168.1.107" class="link-text" target="_blank">前往新官网</a>

        <div class="footer">
            感谢您的理解与支持
        </div>
    </div>

</body>
</html>
